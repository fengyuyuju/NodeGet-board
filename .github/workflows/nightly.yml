name: nightly

# 每日构建：从本分支仓库的 main 分支构建 nightly 版本，滚动更新名为 `nightly` 的预发布。
# nightly 不保证稳定，普通用户请使用正式版。
#
# 定时任务只会运行默认分支（main）上的 workflow 文件，所以这里分两步：
#   1. 定时触发（或在 main 以外的分支上手动触发）时，运行 `dispatch` 作业，它只负责到 main 分支上触发本 workflow；
#   2. 真正的构建以 workflow_dispatch 的方式在 main 分支上运行，检出的就是 main 自己的提交。
# 构建过程中不检出任何由参数传入的 ref。手动触发时「Use workflow from」选哪个分支都可以，非 main 会自动转到 main。

on:
  schedule:
    # UTC 18:00，即北京时间次日 02:00
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      skip_if_unchanged:
        description: "main 自上次 nightly 以来没有新提交时跳过（定时触发会自动带上；手动触发默认总是构建）"
        required: false
        default: false
        type: boolean

concurrency:
  group: nightly-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 定时触发（在 main 上），或手动触发时选的不是 main：转到 main 分支上触发真正的 nightly 构建。
  # 定时触发总是带上"没有新提交就跳过"；手动触发沿用手动填的选项（默认总是构建）
  dispatch:
    name: Trigger nightly on main
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch nightly on the main branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SKIP_IF_UNCHANGED: ${{ github.event_name == 'schedule' || inputs.skip_if_unchanged }}
        run: gh workflow run nightly.yml --repo "${REPO}" --ref main -f skip_if_unchanged="${SKIP_IF_UNCHANGED}"

  # 只在 main 分支上运行的手动触发才会真正构建
  check:
    name: Check for new commits
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Decide whether to build
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SKIP_IF_UNCHANGED: ${{ inputs.skip_if_unchanged }}
        run: |
          set -o pipefail
          build="true"
          if [[ "${SKIP_IF_UNCHANGED}" == "true" ]]; then
            last=$(gh api "repos/${REPO}/git/ref/tags/nightly" --jq .object.sha 2>/dev/null) || last=""
            if [[ "${GITHUB_SHA}" == "${last}" ]]; then
              # 不使用搜索筛选参数，避免 1000 项上限；完整核对分页后再筛选真正的 main 构建。
              # 时间缺失、最近时间并列或记录不完整时都无法证明上次已成功发布。
              latest_run=$(gh api --paginate --slurp \
                "repos/${REPO}/actions/workflows/nightly.yml/runs?per_page=100" 2>/dev/null |
                jq -r --arg sha "${GITHUB_SHA}" '
                  .[0].total_count as $total
                  | select(($total | type) == "number" and $total >= 0 and ($total | floor) == $total)
                  | select(all(.[]; .total_count == $total and (.workflow_runs | type) == "array"))
                  | [.[].workflow_runs[]] as $all
                  | select(($all | length) == $total)
                  | select(all($all[];
                      (.id | type) == "number" and .id > 0 and (.id | floor) == .id
                      and (.head_branch | type) == "string" and .head_branch != ""
                      and (.event | type) == "string" and .event != ""
                      and (.status | type) == "string" and .status != ""))
                  | select(($all | map(.id) | unique | length) == $total)
                  | [$all[] | select(.head_branch == "main" and .event == "workflow_dispatch" and .status == "completed")] as $relevant
                  | select(all($relevant[];
                      (.head_sha | type) == "string" and .head_sha != ""
                      and (.conclusion | type) == "string" and .conclusion != ""))
                  | [$relevant[] | . + {started: (.run_started_at | fromdateiso8601)}] as $runs
                  | ($runs | max_by(.started)) as $latest
                  | select([$runs[] | select(.started == $latest.started)] | length == 1)
                  | $latest
                  | select(.conclusion == "success" and .head_sha == $sha)
                  | .id
                ' 2>/dev/null) || latest_run=""

              if [[ "${latest_run}" =~ ^[0-9]+$ ]]; then
                # 同名 tag 的调度运行也可能成功，必须确认 main 的检查作业实际执行成功。
                checked=$(gh api "repos/${REPO}/actions/runs/${latest_run}/jobs?per_page=100" --jq '
                  select((.jobs | type) == "array" and .total_count == (.jobs | length))
                  | [.jobs[] | select(.name == "Check for new commits")]
                  | select(length == 1 and .[0].conclusion == "success")
                  | "true"
                ' 2>/dev/null) || checked=""
                if [[ "${checked}" == "true" ]]; then
                  build="false"
                  echo "No new commits on main since the last successful nightly (${GITHUB_SHA}), skipping."
                fi
              fi
            fi
          fi

          echo "build=${build}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/build.yml

  publish-release:
    name: Publish nightly Release
    needs:
      - check
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: board-package
          path: dist

      # 把 nightly tag 移动到本次构建的提交，否则 tag 会停留在上一次的提交上
      - name: Move nightly tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if gh api "repos/${REPO}/git/ref/tags/nightly" > /dev/null 2>&1; then
            gh api -X PATCH "repos/${REPO}/git/refs/tags/nightly" -f sha="${SHA}" -F force=true
          else
            gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/tags/nightly" -f sha="${SHA}"
          fi

      # 发布日志 = 固定说明 + 自上一个正式版以来合并的 PR 列表。
      # nightly tag 每天移动、不是版本号，GitHub 找不到"上一个版本"，所以要明确指定起点：最新的正式版。
      # 必须放在 "Move nightly tag" 之后，这样 nightly 才指向本次构建的提交。
      # 生成失败（例如还没有正式版）不应该影响 nightly 发布，此时只保留固定说明。
      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          cat > release-notes.md <<EOF
          自动构建的 nightly 版本，来自 main 分支提交 \`${SHA}\`。
          **不保证稳定，普通用户请使用正式版。**
          EOF

          if previous=$(gh api "repos/${REPO}/releases/latest" --jq .tag_name) && [[ -n "${previous}" ]]; then
            if notes=$(gh api -X POST "repos/${REPO}/releases/generate-notes" \
              -f tag_name=nightly -f previous_tag_name="${previous}" --jq .body); then
              printf '\n---\n\n**相对 %s 的变更**\n\n%s\n' "${previous}" "${notes}" >> release-notes.md
            else
              echo "Failed to generate release notes, keeping the fixed text only." >&2
            fi
          else
            echo "No stable release found, keeping the fixed text only." >&2
          fi

      # Release 名称带构建日期（UTC）
      - name: Resolve build date
        id: date
        shell: bash
        run: echo "date=$(date -u +%Y-%m-%d)" >> "${GITHUB_OUTPUT}"

      - name: Upload release assets
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build ${{ steps.date.outputs.date }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body_path: release-notes.md
          files: dist/*

      # nightly 每天更新的是同一个 Release，而 GitHub 的"发布时间"只在发布时记录一次，
      # 页面上会一直显示第一次发布的日期。把 Release 先切成草稿再立刻发布回来，发布时间就会刷新为现在。
      # tag 和文件都不受影响；草稿期间按 tag 暂时查不到这个 Release。
      # 请求报错也可能已改变服务端状态，始终尝试发布，重试耗尽后再读取状态确认。
      - name: Refresh release date
        id: refresh_release_date
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          if ! gh api -X PATCH "repos/${REPO}/releases/${RELEASE_ID}" -F draft=true --silent; then
            echo "::warning::切换草稿状态的请求失败，仍将尝试重新发布并确认状态。" >&2
          fi
          for attempt in 1 2 3 4 5; do
            if gh api -X PATCH "repos/${REPO}/releases/${RELEASE_ID}" -F draft=false -F prerelease=true -f make_latest=false --silent; then
              exit 0
            fi
            echo "重新发布 nightly 失败（第 ${attempt}/5 次）。" >&2
            if [[ "${attempt}" -lt 5 ]]; then
              sleep 5
            fi
          done
          draft=$(gh api "repos/${REPO}/releases/${RELEASE_ID}" --jq .draft) || draft=""
          case "${draft}" in
            false)
              echo "::warning::发布日期刷新未能确认成功，但 nightly 已处于发布状态。" >&2
              exit 0
              ;;
            true)
              echo "::error::nightly 仍处于草稿状态，请手动发布。" >&2
              ;;
            *)
              echo "::error::无法确认 nightly 已发布，可能仍为草稿，请手动检查。" >&2
              ;;
          esac
          exit 1
